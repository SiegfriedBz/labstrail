# systemd drop-in giving Caddy the node server's secrets (docs/node-host.md → Caddy).
# Install: copy this file to /etc/systemd/system/caddy.service.d/verisci.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
# /etc/caddy/verisci.env is owned by root, mode 600, and holds VERISCI_LOCAL_TOKEN,
# VERISCI_STAGING_TOKEN, VERISCI_PRODUCTION_TOKEN and DKG_ADMIN_TOKEN (README.md here).
# systemd reads it again on each reload, so a changed credential needs only
#   sudo systemctl reload caddy
[Service]
EnvironmentFile=/etc/caddy/verisci.env
