# systemd drop-in giving Caddy the node server's secrets (docs/node-host.md → 7. Caddy and
# the credentials). Install: copy this file to
# /etc/systemd/system/caddy.service.d/verisci.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
# /etc/caddy/verisci.env is owned by root, mode 600, and holds VERISCI_LOCAL_TOKEN,
# VERISCI_STAGING_TOKEN, VERISCI_PRODUCTION_TOKEN and DKG_ADMIN_TOKEN (README.md here).
# systemd reads it again on each reload, so a changed credential needs only
#   sudo systemctl reload caddy
# A start or reload with one of the four empty stops with the variable's name.
# Ubuntu's caddy.service starts Caddy with --environ, which writes every variable, these
# secrets included, to the journal; this ExecStart starts it with its config alone.
[Service]
EnvironmentFile=/etc/caddy/verisci.env
ExecStartPre=/bin/sh -c 'for n in VERISCI_LOCAL_TOKEN VERISCI_STAGING_TOKEN VERISCI_PRODUCTION_TOKEN DKG_ADMIN_TOKEN; do [ -n "$$(printenv $$n)" ] || { echo "$$n is empty in /etc/caddy/verisci.env" >&2; exit 1; }; done'
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/bin/sh -c 'for n in VERISCI_LOCAL_TOKEN VERISCI_STAGING_TOKEN VERISCI_PRODUCTION_TOKEN DKG_ADMIN_TOKEN; do [ -n "$$(printenv $$n)" ] || { echo "$$n is empty in /etc/caddy/verisci.env" >&2; exit 1; }; done'
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
